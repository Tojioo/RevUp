<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --bg:#0C1311;--surface1:#112320;--surface2:#1D424A;--border:#17302D;
      --text:#CBD9D7;--text-dim:rgba(203,217,215,0.62);
      --accent:#00DBAC;--warning:#FFB020;--error:#FF5470;--info:#4DA3FF;
    }
    *{box-sizing:border-box;}
    body{margin:0;}
    .frame{width:390px;height:844px;background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;}
    .subheader{display:flex;align-items:center;gap:10px;padding:20px 20px 4px;}
    .back-btn{width:44px;height:44px;border-radius:12px;background:var(--surface1);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text);flex:none;}
    .back-btn svg{width:18px;height:18px;}
    .subheader-title{font-family:'Manrope',sans-serif;font-weight:700;font-size:13px;color:var(--text-dim);}
    .scroll{flex:1;overflow-y:auto;padding:12px 20px 24px;scrollbar-width:none;-ms-overflow-style:none;}
    .scroll::-webkit-scrollbar{display:none;}

    .badge-row{display:flex;gap:6px;margin-bottom:10px;}
    .badge{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.04em;text-transform:uppercase;padding:3px 8px;border-radius:6px;}
    .badge-public{background:rgba(77,163,255,0.16);color:var(--info);}
    .badge-private{background:rgba(255,176,32,0.14);color:var(--warning);}
    .badge-theme{background:var(--surface2);color:var(--text-dim);}

    .hero-title{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:26px;text-transform:uppercase;line-height:1.08;margin:0 0 14px;color:var(--text);}

    .status-pill{display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:11px;padding:6px 10px;border-radius:8px;margin-bottom:14px;}
    .status-pill svg{width:14px;height:14px;}
    .status-warning{background:rgba(255,176,32,0.14);color:var(--warning);}
    .status-info{background:rgba(77,163,255,0.16);color:var(--info);}
    .status-success{background:rgba(0,219,172,0.14);color:var(--accent);}

    .map-box{height:180px;border-radius:16px;background:
        repeating-linear-gradient(0deg,var(--surface2) 0 1px,transparent 1px 28px),
        repeating-linear-gradient(90deg,var(--surface2) 0 1px,transparent 1px 28px),
        var(--surface1);
      border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-dim);margin-bottom:18px;}
    .map-box svg{width:32px;height:32px;}

    .detail-meta-list{display:flex;flex-direction:column;gap:12px;margin-bottom:22px;}
    .detail-meta-row{display:flex;align-items:center;gap:10px;}
    .detail-meta-row svg{width:18px;height:18px;color:var(--text-dim);flex:none;}
    .detail-meta-text{font-size:14px;color:var(--text);}
    .detail-meta-text b{font-family:'IBM Plex Mono',monospace;font-weight:600;}

    .btn-primary{display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--bg);font-family:'Manrope',sans-serif;font-weight:800;font-size:15px;height:52px;border-radius:14px;border:none;width:100%;}
    .btn-static-disabled{display:flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--text-dim);font-family:'Manrope',sans-serif;font-weight:800;font-size:15px;height:52px;border-radius:14px;width:100%;}
  </style>
</helmet>

<div class="frame">
  <div class="subheader">
    <div class="back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </div>
    <span class="subheader-title">Entdecken</span>
  </div>

  <div class="scroll">
    <div class="badge-row">
      <span class="{{visBadgeClass}}">{{visLabel}}</span>
      <span class="badge badge-theme">{{theme}}</span>
    </div>

    <h1 class="hero-title">{{title}}</h1>

    <div class="{{statusClass}}">
      <sc-if value="{{showLock}}" hint-placeholder-val="{{true}}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2.5"></rect><path d="M8 11V7.5a4 4 0 0 1 8 0V11"></path></svg>
      </sc-if>
      <sc-if value="{{showClock}}" hint-placeholder-val="{{false}}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5l3.3 1.9"></path></svg>
      </sc-if>
      <sc-if value="{{showPin}}" hint-placeholder-val="{{false}}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-7.58 7-12a7 7 0 1 0-14 0c0 4.42 7 12 7 12z"></path><circle cx="12" cy="9" r="2.4"></circle></svg>
      </sc-if>
      {{statusLabel}}
    </div>

    <div class="map-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-7.58 7-12a7 7 0 1 0-14 0c0 4.42 7 12 7 12z"></path><circle cx="12" cy="9" r="2.4"></circle></svg>
    </div>

    <div class="detail-meta-list">
      <div class="detail-meta-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5l3.3 1.9"></path></svg>
        <span class="detail-meta-text">{{timeLabel}}</span>
      </div>
      <div class="detail-meta-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.5" cy="10" r="3.2"></circle><path d="M2.5 20c0-3.3 2.7-5.7 6-5.7s6 2.4 6 5.7"></path><path d="M15.2 5.3a3.2 3.2 0 0 1 0 6.2"></path><path d="M16.5 14.4c2.3.5 4 2.6 4 5.6"></path></svg>
        <span class="detail-meta-text">{{countLabel}}</span>
      </div>
      <div class="detail-meta-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-2a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v2"></path><circle cx="12" cy="7" r="3.2"></circle></svg>
        <span class="detail-meta-text">Veranstaltet von <b>{{organizer}}</b></span>
      </div>
    </div>

    <sc-if value="{{notDone}}" hint-placeholder-val="{{true}}">
      <button class="btn-primary" type="button" onClick="{{act}}">{{btnLabel}}</button>
    </sc-if>
    <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
      <div class="btn-static-disabled">{{btnLabel}}</div>
    </sc-if>
  </div>
</div>
</x-dc>

<script data-dc-script="" data-props='{"visibility":{"editor":"enum","default":"private","options":["private","public"]}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 'idle' };
  }

  act() {
    if (this.state.step === 'idle') {
      this.setState({ step: 'done' });
    }
  }

  renderVals() {
    const visibility = this.props.visibility ?? 'private';
    const isPublic = visibility === 'public';
    const done = this.state.step === 'done';

    const title = isPublic ? 'Feierabend-Cruise' : '90er Treffen Parkhaus Nord';
    const theme = isPublic ? 'Green' : '90s Cars';
    const timeLabel = isPublic ? 'So, 14:00' : 'Open Start, ab 18:00';
    const countLabel = isPublic ? '9 / 15 Plätze belegt' : '18 / 25 Plätze belegt';
    const organizer = isPublic ? 'Aylin' : 'Livio';

    let statusClass = 'status-pill status-warning';
    let statusLabel = 'Standort verborgen bis ' + (isPublic ? 'Beitritt' : 'Freigabe');
    let showLock = true, showClock = false, showPin = false;

    if (done && isPublic) {
      statusClass = 'status-pill status-success';
      statusLabel = 'Standort sichtbar';
      showLock = false; showPin = true;
    } else if (done && !isPublic) {
      statusClass = 'status-pill status-info';
      statusLabel = 'Anfrage gesendet, wartet auf Bestätigung';
      showLock = false; showClock = true;
    }

    const btnLabel = done
      ? (isPublic ? 'Beigetreten' : 'Anfrage gesendet')
      : (isPublic ? 'Beitreten' : 'Anfrage stellen');

    return {
      visBadgeClass: isPublic ? 'badge badge-public' : 'badge badge-private',
      visLabel: isPublic ? 'Öffentlich' : 'Privat',
      theme, title, timeLabel, countLabel, organizer,
      statusClass, statusLabel, showLock, showClock, showPin,
      btnLabel, done, notDone: !done,
      act: () => this.act(),
    };
  }
}
</script>
</body>
</html>
