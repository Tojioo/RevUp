<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --bg:#0C1311;--surface1:#112320;--surface2:#1D424A;--border:#17302D;
      --text:#CBD9D7;--text-dim:rgba(203,217,215,0.62);
      --accent:#00DBAC;--warning:#FFB020;--error:#FF5470;--info:#4DA3FF;
    }
    *{box-sizing:border-box;}
    body{margin:0;}
    .frame{width:390px;height:844px;background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;}
    .topbar{display:flex;align-items:center;gap:8px;padding:20px 20px 8px;}
    .brand-name{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:15px;letter-spacing:0.04em;text-transform:uppercase;color:var(--text);}
    .scroll{flex:1;overflow-y:auto;padding:4px 20px 20px;scrollbar-width:none;-ms-overflow-style:none;}
    .scroll::-webkit-scrollbar{display:none;}
    .large-title{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:34px;line-height:1;text-transform:uppercase;letter-spacing:0.01em;margin:6px 0 16px;color:var(--text);}
    .chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none;-ms-overflow-style:none;}
    .chip-row::-webkit-scrollbar{display:none;}
    .chip{flex:none;border:1px solid var(--border);background:var(--surface1);color:var(--text-dim);font-family:'Manrope',sans-serif;font-weight:600;font-size:13px;padding:0 16px;height:44px;display:flex;align-items:center;border-radius:999px;}
    .chip.active{background:var(--accent);border-color:var(--accent);color:var(--bg);}
    .card-list{display:flex;flex-direction:column;gap:12px;}
    .meet-card{background:var(--surface1);border:1px solid var(--border);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;}
    .badge-row{display:flex;gap:6px;}
    .badge{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.04em;text-transform:uppercase;padding:3px 8px;border-radius:6px;}
    .badge-public{background:rgba(77,163,255,0.16);color:var(--info);}
    .badge-private{background:rgba(255,176,32,0.14);color:var(--warning);}
    .badge-theme{background:var(--surface2);color:var(--text-dim);}
    .meet-title{font-family:'Manrope',sans-serif;font-weight:700;font-size:17px;margin:0;color:var(--text);}
    .meta-row{display:flex;gap:16px;flex-wrap:wrap;}
    .meta-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-dim);}
    .meta-item svg{width:14px;height:14px;flex:none;}
    .meet-foot{display:flex;align-items:center;justify-content:space-between;margin-top:2px;}
    .chev{color:var(--text-dim);display:flex;}
    .chev svg{width:18px;height:18px;}
    .empty-state{padding:32px 8px;text-align:center;color:var(--text-dim);font-size:13px;}
    .tabbar{display:flex;border-top:1px solid var(--border);background:var(--surface1);padding:10px 8px 24px;}
    .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text-dim);font-family:'Manrope',sans-serif;font-size:10px;font-weight:600;}
    .tab svg{width:22px;height:22px;}
    .tab.active{color:var(--accent);}
  </style>
</helmet>

<div class="frame">
  <div class="topbar">
    <svg width="28" height="28" viewBox="0 0 100 100">
      <rect width="100" height="100" rx="26" fill="#112320"></rect>
      <path d="M 25.96 74.04 A 34 34 0 1 1 74.04 74.04" fill="none" stroke="#CBD9D7" stroke-width="8" stroke-linecap="round"></path>
      <line x1="50" y1="50" x2="68.38" y2="31.62" stroke="#00DBAC" stroke-width="9" stroke-linecap="round"></line>
      <circle cx="50" cy="50" r="6" fill="#CBD9D7"></circle>
    </svg>
    <span class="brand-name">RevUp</span>
  </div>

  <div class="scroll">
    <h1 class="large-title">Entdecken</h1>

    <div class="chip-row">
      <sc-for list="{{themes}}" as="t" hint-placeholder-count="5">
        <div class="{{t.chipClass}}" onClick="{{t.pick}}">{{t.name}}</div>
      </sc-for>
    </div>

    <sc-if value="{{hasResults}}" hint-placeholder-val="{{true}}">
      <div class="card-list">
        <sc-for list="{{meets}}" as="m" hint-placeholder-count="3">
          <article class="meet-card">
            <div class="badge-row">
              <span class="{{m.visBadgeClass}}">{{m.visLabel}}</span>
              <span class="badge badge-theme">{{m.theme}}</span>
            </div>
            <h2 class="meet-title">{{m.title}}</h2>
            <div class="meta-row">
              <span class="meta-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5l3.3 1.9"></path></svg>
                {{m.time}}
              </span>
              <span class="meta-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-7.58 7-12a7 7 0 1 0-14 0c0 4.42 7 12 7 12z"></path><circle cx="12" cy="9" r="2.4"></circle></svg>
                {{m.locationLabel}}
              </span>
            </div>
            <div class="meet-foot">
              <span class="meta-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.5" cy="10" r="3.2"></circle><path d="M2.5 20c0-3.3 2.7-5.7 6-5.7s6 2.4 6 5.7"></path><path d="M15.2 5.3a3.2 3.2 0 0 1 0 6.2"></path><path d="M16.5 14.4c2.3.5 4 2.6 4 5.6"></path></svg>
                {{m.countLabel}}
              </span>
              <span class="chev">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
              </span>
            </div>
          </article>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{noResults}}" hint-placeholder-val="{{false}}">
      <p class="empty-state">Keine Meets zu diesem Thema.</p>
    </sc-if>
  </div>

  <nav class="tabbar">
    <div class="tab active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M15.2 8.8l-2 4.4-4.4 2 2-4.4 4.4-2z"></path></svg>
      Entdecken
    </div>
    <div class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v8M8 12h8"></path></svg>
      Erstellen
    </div>
    <div class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.1 17.8A8.6 8.6 0 1 1 17.9 17.8"></path><path d="M12 12l4.4-4.4"></path><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"></circle></svg>
      Meine Meets
    </div>
    <div class="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5a5 5 0 0 0-5 5v3.2L5.3 15h13.4L17 11.7V8.5a5 5 0 0 0-5-5z"></path><path d="M9.7 18a2.4 2.4 0 0 0 4.6 0"></path></svg>
      Anfragen
    </div>
  </nav>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { selectedTheme: 'Alle' };
  }

  select(theme) {
    this.setState({ selectedTheme: theme });
  }

  renderVals() {
    const allMeets = [
      { id: 1, theme: 'Tuning', visibility: 'public', title: 'Sonntagsausfahrt Tuning-Treff', time: 'Sa, 18:00', participants: 12, max: 30 },
      { id: 2, theme: '90s Cars', visibility: 'private', title: '90er Treffen Parkhaus Nord', time: 'Open Start 18:00', participants: 18, max: 25 },
      { id: 3, theme: 'Green', visibility: 'public', title: 'EV & Hybrid Stammtisch', time: 'So, 14:00', participants: 6, max: 20 },
    ];
    const themeNames = ['Alle', '90s Cars', 'Tuning', 'Motorräder', 'Green'];
    const selected = this.state.selectedTheme;

    const themes = themeNames.map((name) => ({
      name,
      chipClass: 'chip' + (name === selected ? ' active' : ''),
      pick: () => this.select(name),
    }));

    const filtered = selected === 'Alle' ? allMeets : allMeets.filter((m) => m.theme === selected);
    const meets = filtered.map((m) => ({
      ...m,
      visBadgeClass: m.visibility === 'public' ? 'badge badge-public' : 'badge badge-private',
      visLabel: m.visibility === 'public' ? 'Öffentlich' : 'Privat',
      locationLabel: m.visibility === 'public' ? 'Ort nach Beitritt' : 'Ort nach Freigabe',
      countLabel: m.participants + '/' + m.max,
    }));

    return {
      themes,
      meets,
      hasResults: meets.length > 0,
      noResults: meets.length === 0,
    };
  }
}
</script>
</body>
</html>
